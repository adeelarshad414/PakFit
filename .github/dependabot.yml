version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"

  - package-ecosystem: "swift"
    directory: "/ios/PakFitIOS"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:20"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ios"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:40"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
