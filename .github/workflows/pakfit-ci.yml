name: PakFit CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.5

      - name: Run Android unit tests and assemble debug APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PakFit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-swift:
    name: iOS Swift core and app compile
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Swift smoke tests
        working-directory: ios/PakFitIOS
        run: swift run PakFitCoreSmokeTests

      - name: Compile SwiftUI app target
        working-directory: ios/PakFitIOS
        run: swift build --target PakFitApp

      - name: Validate iOS privacy manifest
        run: |
          plutil -lint ios/PakFitIOS/Sources/PakFitApp/PrivacyInfo.xcprivacy
          grep -q "NSPrivacyAccessedAPICategoryUserDefaults" ios/PakFitIOS/Sources/PakFitApp/PrivacyInfo.xcprivacy
          grep -q "CA92.1" ios/PakFitIOS/Sources/PakFitApp/PrivacyInfo.xcprivacy

  source-gates:
    name: Source quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: English-only app source check
        run: |
          if rg -n "Urdu|اردو|[\u0600-\u06FF]" README.md app/src ios; then
            echo "English-only app source check failed."
            exit 1
          fi

      - name: Secret-pattern smoke check
        run: |
          if rg -n "(api[_-]?key|secret|token|password)\s*[:=]\s*['\"][^'\"]+" README.md app ios specs scripts docs .github; then
            echo "Potential hardcoded secret detected."
            exit 1
          fi
