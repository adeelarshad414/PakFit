name: PakFit CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android tests and release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate cross-platform version alignment
        run: bash scripts/validate-version-alignment.sh

      - name: Run Android unit tests, lint, and assemble APK/AAB artifacts
        run: ./gradlew --dependency-verification strict testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease bundleRelease

      - name: Validate Android artifact version metadata
        run: bash scripts/validate-version-alignment.sh --include-built-metadata

      - name: Validate Android permission privacy posture
        run: bash scripts/validate-android-permissions.sh

      - name: Validate Android exported component surface
        run: bash scripts/validate-android-exported-surface.sh

      - name: Validate Android network security posture
        run: bash scripts/validate-android-network-security.sh

      - name: Validate food photo privacy posture
        run: bash scripts/validate-photo-privacy.sh

      - name: Generate dependency inventory
        run: bash scripts/generate-dependency-inventory.sh

      - name: Generate release evidence report
        run: bash scripts/generate-release-report.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PakFit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PakFit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: PakFit-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release evidence report
        uses: actions/upload-artifact@v4
        with:
          name: PakFit-release-evidence
          path: |
            outputs/PakFit/reports/*.md
            outputs/PakFit/reports/dependencies/*.txt
          if-no-files-found: error

  ios-swift:
    name: iOS Swift core and app compile
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Swift smoke tests
        working-directory: ios/PakFitIOS
        run: swift run PakFitCoreSmokeTests

      - name: Compile SwiftUI app target
        working-directory: ios/PakFitIOS
        run: swift build --target PakFitApp

      - name: Validate iOS privacy manifest
        run: |
          plutil -lint ios/PakFitIOS/Sources/PakFitApp/PrivacyInfo.xcprivacy
          grep -q "NSPrivacyAccessedAPICategoryUserDefaults" ios/PakFitIOS/Sources/PakFitApp/PrivacyInfo.xcprivacy
          grep -q "CA92.1" ios/PakFitIOS/Sources/PakFitApp/PrivacyInfo.xcprivacy

      - name: Validate iOS network security posture
        run: bash scripts/validate-ios-network-security.sh

  source-gates:
    name: Source quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: English-only app source check
        run: |
          if rg -n "Urdu|اردو|[\u0600-\u06FF]" README.md app/src ios; then
            echo "English-only app source check failed."
            exit 1
          fi

      - name: Secret-pattern smoke check
        run: |
          if rg -n "(api[_-]?key|secret|token|password)\s*[:=]\s*['\"][^'\"]+" README.md app ios specs scripts docs .github; then
            echo "Potential hardcoded secret detected."
            exit 1
          fi
